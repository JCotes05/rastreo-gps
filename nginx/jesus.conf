# Configuración de Nginx — Tu instancia (Ubuntu)
# Desplegado automáticamente en /etc/nginx/sites-available/default por GitHub Actions.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    if ($host = jesuscotes.sytes.net) {
        return 301 https://$host$request_uri;
    }

    server_name jesuscotes.sytes.net;
    return 404;
}

server {
    root /var/www/rastreo;
    index index.html;

    server_name jesuscotes.sytes.net;

    location /datos {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /recorrido {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /recorridos {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /puntos_recorrido {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jesuscotes.sytes.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jesuscotes.sytes.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
