# .github/workflows/desplegar.yml
#
# QUÉ HACE: cada push a "main" dispara 3 trabajos en paralelo (uno por
# instancia). Cada uno prepara la llave SSH, copia los archivos
# nuevos por SCP, y por SSH los instala y reinicia los servicios.
#
# A diferencia de la versión anterior, este NO usa ninguna acción de
# terceros para conectarse — usa "ssh" y "scp" directo, los mismos
# comandos que ya conocen de la terminal. Son parte de cualquier
# máquina Linux (incluidos los servidores de GitHub), así que no hay
# ninguna imagen de Docker que construir ni que pueda fallar por eso.

name: Desplegar a las 3 instancias

on:
  push:
    branches:
      - main

jobs:

  # =================================================================
  # INSTANCIA DE VALENTINA (Ubuntu)
  # =================================================================
  desplegar-valentina:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código de este repositorio
        uses: actions/checkout@v4

      - name: Preparar la llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VALENTINA_SSH_KEY }}" > ~/.ssh/clave.pem
          chmod 600 ~/.ssh/clave.pem
          ssh-keyscan -H ${{ secrets.VALENTINA_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copiar los archivos a la instancia
        run: |
          ssh -i ~/.ssh/clave.pem ubuntu@${{ secrets.VALENTINA_IP }} "mkdir -p ~/despliegue"
          scp -i ~/.ssh/clave.pem \
            servidor/basedatos.py servidor/listener.py servidor/servidor_web.py \
            web/index.html nginx/valentina.conf \
            ubuntu@${{ secrets.VALENTINA_IP }}:~/despliegue/

      - name: Instalar los archivos y reiniciar los servicios
        run: |
          ssh -i ~/.ssh/clave.pem ubuntu@${{ secrets.VALENTINA_IP }} '
            sudo cp ~/despliegue/basedatos.py ~/basedatos.py
            sudo cp ~/despliegue/listener.py ~/listener.py
            sudo cp ~/despliegue/servidor_web.py ~/servidor_web.py
            sudo cp ~/despliegue/index.html /var/www/rastreo/index.html
            sudo cp ~/despliegue/valentina.conf /etc/nginx/sites-available/default
            sudo nginx -t
            sudo systemctl restart nginx
            sudo systemctl restart listener.service
            sudo systemctl restart servidor-web.service
          '

  # =================================================================
  # TU INSTANCIA (Ubuntu)
  # =================================================================
  desplegar-jesus:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código de este repositorio
        uses: actions/checkout@v4

      - name: Preparar la llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.JESUS_SSH_KEY }}" > ~/.ssh/clave.pem
          chmod 600 ~/.ssh/clave.pem
          ssh-keyscan -H ${{ secrets.JESUS_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copiar los archivos a la instancia
        run: |
          ssh -i ~/.ssh/clave.pem ubuntu@${{ secrets.JESUS_IP }} "mkdir -p ~/despliegue"
          scp -i ~/.ssh/clave.pem \
            servidor/basedatos.py servidor/listener.py servidor/servidor_web.py \
            web/index.html nginx/jesus.conf \
            ubuntu@${{ secrets.JESUS_IP }}:~/despliegue/

      - name: Instalar los archivos y reiniciar los servicios
        run: |
          ssh -i ~/.ssh/clave.pem ubuntu@${{ secrets.JESUS_IP }} '
            sudo cp ~/despliegue/basedatos.py ~/basedatos.py
            sudo cp ~/despliegue/listener.py ~/listener.py
            sudo cp ~/despliegue/servidor_web.py ~/servidor_web.py
            sudo cp ~/despliegue/index.html /var/www/rastreo/index.html
            sudo cp ~/despliegue/jesus.conf /etc/nginx/sites-available/default
            sudo nginx -t
            sudo systemctl restart nginx
            sudo systemctl restart listener.service
            sudo systemctl restart servidor-web.service
          '

  # =================================================================
  # INSTANCIA DE ADRIÁN (Amazon Linux)
  # =================================================================
  desplegar-adrian:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código de este repositorio
        uses: actions/checkout@v4

      - name: Preparar la llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ADRIAN_SSH_KEY }}" > ~/.ssh/clave.pem
          chmod 600 ~/.ssh/clave.pem
          ssh-keyscan -H ${{ secrets.ADRIAN_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copiar los archivos a la instancia
        run: |
          ssh -i ~/.ssh/clave.pem ec2-user@${{ secrets.ADRIAN_IP }} "mkdir -p ~/despliegue"
          scp -i ~/.ssh/clave.pem \
            servidor/basedatos.py servidor/listener.py servidor/servidor_web.py \
            web/index.html nginx/adrian.conf \
            ec2-user@${{ secrets.ADRIAN_IP }}:~/despliegue/

      - name: Instalar los archivos y reiniciar los servicios
        run: |
          ssh -i ~/.ssh/clave.pem ec2-user@${{ secrets.ADRIAN_IP }} '
            sudo cp ~/despliegue/basedatos.py ~/basedatos.py
            sudo cp ~/despliegue/listener.py ~/listener.py
            sudo cp ~/despliegue/servidor_web.py ~/servidor_web.py
            sudo cp ~/despliegue/index.html /var/www/rastreo/index.html
            sudo cp ~/despliegue/adrian.conf /etc/nginx/nginx.conf
            sudo nginx -t
            sudo systemctl restart nginx
            sudo systemctl restart listener.service
            sudo systemctl restart servidor-web.service
          '
