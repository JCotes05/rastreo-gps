<style>
  /* =====================================================================
     PALETA (la misma de siempre)
     ===================================================================== */
  :root {
    --oscuro: #0B1F3A;
    --medio: #1F3B5C;
    --gris-azul: #A7B1BE;
    --claro: #E6E9EF;
    --carbon: #2B2F36;
    --sombra: 0 14px 32px -12px rgba(11, 31, 58, 0.6);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--medio);
    color: var(--claro);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; }

  /* =====================================================================
     MAPAS A PANTALLA COMPLETA
     Los dos mapas ocupan TODA la ventana, uno encima del otro. Solo se
     muestra uno a la vez con "visibility" (no con display:none): así el
     contenedor del mapa oculto conserva su tamaño real y Leaflet no
     se rompe al volver a mostrarlo.
     ===================================================================== */
  #mapa, #mapa-historico {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    z-index: 1;
    background: var(--gris-azul);
  }
  #mapa-historico { visibility: hidden; }
  body.modo-historicos #mapa { visibility: hidden; }
  body.modo-historicos #mapa-historico { visibility: visible; }

  .leaflet-container.armado,
  .leaflet-container.armado .leaflet-interactive { cursor: crosshair !important; }
  /* Círculo de zona: "move" al pasar el mouse por encima, "grabbing" mientras se arrastra. */
  .leaflet-container.sobre-zona { cursor: move !important; }
  .leaflet-container.arrastrando-zona,
  .leaflet-container.arrastrando-zona * { cursor: grabbing !important; }
  /* Sin el retardo de ~300 ms de los toques ni el zoom por doble toque sobre botones y campos. */
  button, input { touch-action: manipulation; }

  .icono-camion { font-size: 28px; text-align: center; line-height: 36px; }

  /* =====================================================================
     ELEMENTOS FLOTANTES
     ===================================================================== */
  .barra-superior {
    position: fixed; top: 14px; left: 14px; z-index: 1200;
    display: flex; align-items: center; gap: 10px;
  }
  .boton-menu {
    width: 46px; height: 46px; border: 0; border-radius: 14px;
    background: var(--oscuro); color: var(--claro);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: var(--sombra);
    transition: transform 0.15s ease;
  }
  .boton-menu:hover { transform: scale(1.06); }
  .boton-menu:active { transform: scale(0.95); }

  .titulo-flotante {
    height: 46px; padding: 0 18px; border-radius: 14px;
    background: var(--oscuro); color: var(--claro);
    display: flex; align-items: center; gap: 12px;
    box-shadow: var(--sombra);
    font-weight: 800; font-size: 14px; letter-spacing: 0.08em; white-space: nowrap;
  }
  .titulo-sep { width: 1px; height: 20px; background: var(--gris-azul); opacity: 0.6; }
  /* Logo de Orbita dentro de la barra: la imagen trae un poco de brillo alrededor, por eso los márgenes negativos. */
  .titulo-flotante { padding-left: 12px; }
  .logo-marca { display: block; height: 36px; width: auto; margin: 0 -2px 0 0; user-select: none; -webkit-user-drag: none; }
  .eslogan-menu {
    margin: 14px 0 2px; text-align: center;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gris-azul);
  }
  .titulo-modo { display: flex; align-items: center; gap: 8px; }
  .punto-vivo {
    width: 9px; height: 9px; border-radius: 50%; background: var(--claro);
    animation: latido 1.8s infinite;
  }
  @keyframes latido {
    0%   { box-shadow: 0 0 0 0 rgba(230, 233, 239, 0.65); }
    70%  { box-shadow: 0 0 0 9px rgba(230, 233, 239, 0); }
    100% { box-shadow: 0 0 0 0 rgba(230, 233, 239, 0); }
  }
  body.modo-historicos .punto-vivo { display: none; }

  /* Ventana flotante con los datos en vivo (solo Tiempo Real) */
  .ventana-datos {
    position: fixed; top: 14px; right: 14px; z-index: 1200;
    display: grid; grid-template-columns: repeat(4, auto);
    background: rgba(230, 233, 239, 0.97); color: var(--oscuro);
    border-radius: 16px; box-shadow: var(--sombra); overflow: hidden;
  }
  .dato-flotante { padding: 9px 18px; min-width: 100px; border-left: 1px solid rgba(167, 177, 190, 0.75); }
  .dato-flotante:first-child { border-left: 0; }
  .dato-etiqueta { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; color: var(--medio); }
  .dato-valor {
    display: block; margin-top: 2px; font-size: 16px; font-weight: 800; color: var(--oscuro);
    letter-spacing: -0.01em; transition: color 0.45s ease; white-space: nowrap;
  }
  .dato-valor.actualizado { color: var(--carbon); }
  body.modo-historicos .ventana-datos,
  body.modo-historicos .boton-centrar { display: none; }

  .boton-centrar {
    position: fixed; right: 12px; bottom: 108px; z-index: 1200;
    width: 46px; height: 46px; border-radius: 50%; border: 0;
    background: var(--oscuro); cursor: pointer;
    box-shadow: 0 10px 20px -6px rgba(11, 31, 58, 0.75);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease;
  }
  .boton-centrar:hover { transform: scale(1.07); }
  .boton-centrar:active { transform: scale(0.95); }

  /* =====================================================================
     MENÚ LATERAL DESPLEGABLE
     ===================================================================== */
  .menu-lateral {
    position: fixed; top: 72px; left: 14px; z-index: 1150;
    width: 360px; max-width: calc(100vw - 28px);
    max-height: calc(100vh - 86px);
    max-height: calc(100dvh - 86px);
    display: flex; flex-direction: column;
    background: var(--medio); color: var(--claro);
    border-radius: 20px; box-shadow: 0 24px 60px -20px rgba(11, 31, 58, 0.75);
    transform: translateX(calc(-100% - 30px)); visibility: hidden;
    transition: transform 0.28s ease, visibility 0s linear 0.28s;
  }
  body.menu-abierto .menu-lateral {
    transform: none; visibility: visible;
    transition: transform 0.28s ease;
  }
  .menu-cabecera { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 6px 20px; }
  .menu-titulo { font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gris-azul); }
  .menu-cerrar {
    width: 32px; height: 32px; border: 0; border-radius: 10px; cursor: pointer;
    background: transparent; color: var(--claro);
    display: flex; align-items: center; justify-content: center;
  }
  .menu-cerrar:hover { background: rgba(230, 233, 239, 0.12); }
  .menu-cuerpo { padding: 8px 18px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .selector-modo, .tipo-filtro { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .modo, .tipo-btn {
    border: 0; border-radius: 12px; padding: 11px 8px; cursor: pointer;
    background: rgba(230, 233, 239, 0.12); color: var(--claro);
    font-size: 13px; font-weight: 700;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .modo:hover, .tipo-btn:hover { background: rgba(230, 233, 239, 0.2); }
  .modo.activo, .tipo-btn.activo { background: var(--claro); color: var(--oscuro); }

  /* Paneles de filtro */
  .panel { background: rgba(11, 31, 58, 0.42); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .panel label {
    display: block; margin: 10px 0 5px;
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gris-azul);
  }
  .panel label:first-child { margin-top: 0; }
  .panel input[type=datetime-local] {
    width: 100%; border: 0; border-radius: 10px; padding: 9px 10px;
    background: var(--claro); color: var(--oscuro);
    font-family: inherit; font-size: 13px; font-weight: 600; color-scheme: light;
  }
  .panel input[type=range] { width: 100%; accent-color: var(--claro); }
  .ayuda { margin: 0 0 8px; font-size: 12.5px; line-height: 1.45; color: var(--claro); }
  .fila-botones { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    flex: 1; border-radius: 10px; padding: 10px 8px; cursor: pointer;
    font-size: 12.5px; font-weight: 800; border: 1px solid transparent;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-principal { background: var(--claro); color: var(--oscuro); }
  .btn-secundario { background: transparent; color: var(--claro); border-color: var(--gris-azul); }
  .aviso { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: rgba(230, 233, 239, 0.14); font-size: 12px; font-weight: 700; }
  .aviso:empty { display: none; }

  /* Lista de rutas */
  .cabecera-resultados { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 2px 8px; }
  .etiqueta-resultados { flex: 1; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gris-azul); }
  .accion-lista { flex: none; white-space: nowrap; border: 0; background: transparent; color: var(--claro); font-size: 12px; font-weight: 800; text-decoration: underline; cursor: pointer; padding: 2px 4px; }
  .lista-recorridos { display: flex; flex-direction: column; gap: 9px; }
  .btn-ver-todas { display: block; width: 100%; margin-top: 12px; }
  .lista-vacia { text-align: center; font-size: 13px; line-height: 1.45; padding: 18px 12px; border: 1px dashed var(--gris-azul); border-radius: 12px; }

  .tarjeta-recorrido {
    background: var(--claro); color: var(--oscuro);
    border-radius: 14px; border-left: 7px solid var(--gris-azul);
    padding: 11px 14px 11px 14px; cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .tarjeta-recorrido:hover, .tarjeta-recorrido:focus-visible { transform: translateY(-2px); box-shadow: 0 8px 18px -10px rgba(0, 0, 0, 0.55); outline: none; }
  .tarjeta-linea { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
  .tarjeta-linea + .tarjeta-linea { margin-top: 3px; }
  .tarjeta-etq { width: 46px; flex: none; font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--medio); }
  .tarjeta-val { font-weight: 800; }
  .tarjeta-detalle { cursor: default; margin-bottom: 12px; }
  .tarjeta-detalle:hover { transform: none; box-shadow: none; }

  /* Detalle de una ruta */
  .volver { border: 0; background: transparent; color: var(--claro); font-size: 13px; font-weight: 800; cursor: pointer; padding: 4px 0 10px; }
  /* En la tarjeta del detalle, un punto de color junto a Desde / Hasta explica
     los marcadores del mapa (verde = inicio, naranja oscuro = fin). */
  .tarjeta-detalle .tarjeta-etq { display: flex; align-items: center; gap: 6px; width: 68px; }
  .punto-color { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .slider-etiqueta { margin-top: 8px; font-size: 14px; font-weight: 800; }
  .punto-info { background: var(--oscuro); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 13px; line-height: 1.6; }
  .punto-info b { font-size: 11px; letter-spacing: 0.08em; color: var(--gris-azul); }
  .sub-titulo { margin: 18px 2px 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gris-azul); }
  .resultado-sub { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--claro); color: var(--oscuro); font-size: 13px; line-height: 1.5; }
  .nota-ajuste { margin: 0 0 10px; padding: 8px 10px; border-left: 4px solid var(--medio); border-radius: 6px; background: rgba(31, 59, 92, 0.12); font-size: 12.5px; font-weight: 700; line-height: 1.4; }
  .pasada {
    display: block; width: 100%; margin-top: 7px; padding: 8px 10px; text-align: left; border: 0; border-radius: 8px; cursor: pointer;
    background: rgba(11, 31, 58, 0.09); color: var(--oscuro); font-size: 12.5px; font-weight: 600; line-height: 1.5;
  }
  .pasada:hover { background: rgba(11, 31, 58, 0.16); }

  .menu-cuerpo::-webkit-scrollbar { width: 8px; }
  .menu-cuerpo::-webkit-scrollbar-thumb { background: rgba(167, 177, 190, 0.45); border-radius: 8px; }

  /* Aviso corto sobre el mapa (resultado de mover una zona): se ve aunque el menú esté cerrado. */
  .aviso-mapa {
    position: fixed; top: 70px; left: 50%; z-index: 1300;
    width: max-content; max-width: calc(100vw - 28px); padding: 9px 16px; border-radius: 999px;
    background: var(--oscuro); color: var(--claro); box-shadow: var(--sombra);
    font-size: 13px; font-weight: 700; text-align: center;
    opacity: 0; transform: translate(-50%, -8px); pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .aviso-mapa.visible { opacity: 1; transform: translate(-50%, 0); }

  /* =====================================================================
     SLIDER FLOTANTE
     Cuando hay una ruta abierta, el slider vive FUERA del menú, pegado
     abajo sobre el mapa: se puede cerrar el menú y seguir moviéndolo
     viendo el mapa completo. (Dentro del menú no podría ser "fixed":
     el menú tiene transform y arrastraría al slider con él.)
     ===================================================================== */
  :root { --alto-slider: 70px; }
  .slider-flotante {
    display: none;
    position: fixed; z-index: 1160;
    left: 14px; bottom: 14px; width: 520px; max-width: calc(100vw - 100px);
    height: var(--alto-slider); padding: 9px 14px 8px;
    background: var(--oscuro); color: var(--claro);
    border-radius: 16px; box-shadow: var(--sombra);
  }
  body.modo-historicos.ruta-abierta .slider-flotante { display: block; }
  /* Con el menú abierto en escritorio, el slider queda a la derecha de él. */
  body.menu-abierto .slider-flotante { left: 388px; max-width: calc(100vw - 460px); }
  .slider-fila { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .slider-flotante label {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gris-azul);
  }
  .slider-flotante .slider-etiqueta { flex: none; margin: 0; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .slider-flotante input[type=range] { display: block; width: 100%; height: 28px; margin: 4px 0 0; accent-color: var(--claro); }
  /* Los controles de Leaflet (zoom, atribución) suben para no quedar tapados por el slider. */
  @media (max-width: 1000px) {
    body.modo-historicos.ruta-abierta #mapa-historico .leaflet-bottom { margin-bottom: calc(var(--alto-slider) + 14px); }
  }

  /* =====================================================================
     CELULAR — pantalla limpia: el mapa es lo principal.
       · El menú es una hoja que sube desde abajo (más baja y compacta).
       · Las coordenadas en vivo son una tira pequeña de una sola fila.
       · Con una ruta abierta, el slider flota abajo y la hoja se sube
         por encima de él (así se puede cerrar la hoja y seguir usando
         el slider con el mapa a la vista).
       · Los campos de texto usan 16 px: con menos, iOS hace zoom al tocarlos.
     ===================================================================== */
  @media (max-width: 720px) {
    :root { --alto-slider: 66px; }

    .barra-superior { top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; gap: 8px; }
    .boton-menu { width: 42px; height: 42px; border-radius: 12px; }
    .titulo-flotante { height: 42px; padding: 0 12px 0 8px; gap: 8px; border-radius: 12px; font-size: 12px; }
    .logo-marca { height: 32px; }

    .ventana-datos {
      top: calc(60px + env(safe-area-inset-top, 0px)); left: 10px; right: auto;
      grid-template-columns: repeat(4, auto); border-radius: 12px;
    }
    .dato-flotante { min-width: 0; padding: 5px 9px; }
    .dato-etiqueta { font-size: 8.5px; letter-spacing: 0.08em; }
    .dato-valor { margin-top: 1px; font-size: 11.5px; letter-spacing: 0; font-variant-numeric: tabular-nums; }

    .menu-lateral {
      top: auto; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      width: auto; max-width: none; border-radius: 18px;
      max-height: 52vh; max-height: 52dvh;
      transform: translateY(calc(100% + 30px));
    }
    body.modo-historicos.ruta-abierta .menu-lateral {
      bottom: calc(var(--alto-slider) + 16px + env(safe-area-inset-bottom, 0px));
      max-height: 42vh; max-height: 42dvh;
    }
    .menu-cabecera { padding: 10px 12px 0 16px; }
    .menu-cuerpo { padding: 4px 12px 12px; }
    .selector-modo, .tipo-filtro { gap: 6px; margin-bottom: 8px; }
    .modo, .tipo-btn { padding: 9px 6px; font-size: 12.5px; }
    .panel { padding: 10px 12px; margin-bottom: 8px; }
    .panel input[type=datetime-local] { font-size: 16px; padding: 7px 10px; }
    .ayuda { margin-bottom: 6px; font-size: 12px; }
    .fila-botones { margin-top: 8px; }
    .btn { min-height: 40px; padding: 8px; }
    .cabecera-resultados { margin: 10px 2px 6px; }
    .lista-recorridos { gap: 7px; }
    .tarjeta-recorrido { padding: 8px 12px; border-radius: 12px; }
    .tarjeta-detalle { margin-bottom: 8px; }
    .volver { padding: 2px 0 8px; }
    .sub-titulo { margin: 12px 2px 6px; }
    .punto-info { padding: 8px 12px; margin-bottom: 8px; font-size: 12.5px; line-height: 1.5; }
    .resultado-sub { margin-top: 8px; padding: 10px 12px; font-size: 12.5px; }

    .slider-flotante,
    body.menu-abierto .slider-flotante {
      left: 8px; right: 8px; width: auto; max-width: none;
      bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    }
    .aviso-mapa { top: calc(60px + env(safe-area-inset-top, 0px)); }

    /* Menos elementos sobre el mapa: el zoom se hace con los dedos. */
    .leaflet-control-zoom { display: none; }
    .leaflet-control-attribution { font-size: 9px; }
    .boton-centrar { right: 12px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 44px; height: 44px; }
    body.menu-abierto .boton-centrar { display: none; }
  }
  @media (max-width: 380px) {
    .titulo-flotante { font-size: 11.5px; letter-spacing: 0.04em; padding: 0 10px 0 6px; }
    .logo-marca { height: 29px; }
    .dato-flotante { padding: 5px 7px; }
    .dato-valor { font-size: 10.5px; }
  }
  @media (max-width: 340px) {
    .ventana-datos { right: 10px; }
    .dato-flotante { padding: 4px 4px; }
    .dato-valor { font-size: 9.5px; }
  }
</style>
</head>
<body>

<div id="mapa"></div>
<div id="mapa-historico"></div>

<!-- ============ Botón de menú + título (flotantes, arriba a la izquierda) ============ -->
<div class="barra-superior">
  <button class="boton-menu" id="boton-menu" onclick="alternarMenu()" aria-label="Abrir menú" aria-expanded="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </svg>
  </button>

<script>
  // =====================================================================
  // 1. UTILIDADES
  // =====================================================================

  function porId(id) { return document.getElementById(id); }

  // Aviso corto sobre el mapa (se apaga solo). Sirve para dar el resultado
  // de mover una zona aunque el menú esté cerrado, como pasa en celular.
  var temporizadorAviso = null;
  function mostrarAvisoMapa(texto) {
    var caja = porId('aviso-mapa');
    caja.textContent = texto;
    caja.classList.add('visible');
    clearTimeout(temporizadorAviso);
    temporizadorAviso = setTimeout(function () { caja.classList.remove('visible'); }, 2800);
  }

  // Pide un JSON al servidor; si responde con error, lo convierte en una
  // excepción para poder mostrar un mensaje en vez de quedarse "cargando".
  function pedirJSON(url) {
    return fetch(url).then(function (r) {
      if (!r.ok) { throw new Error('HTTP ' + r.status); }
      return r.json();
    });
  }

  // Distancia en metros entre dos coordenadas (fórmula de Haversine).
  function distanciaMetros(lat1, lon1, lat2, lon2) {
    var R = 6371000, rad = Math.PI / 180;
    var dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
  }

  // Distancia en metros de un punto a un SEGMENTO (dos puntos consecutivos
  // de una ruta). Sirve para saber si un clic cayó "sobre" una línea.
  function distPuntoSegmentoM(lat, lon, la1, lo1, la2, lo2) {
    var rad = Math.PI / 180, kx = 111320 * Math.cos(lat * rad), ky = 110540;
    var ax = (lo1 - lon) * kx, ay = (la1 - lat) * ky;
    var bx = (lo2 - lon) * kx, by = (la2 - lat) * ky;
    var dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
    var t = len2 === 0 ? 0 : Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len2));
    var cx = ax + t * dx, cy = ay + t * dy;
    return Math.sqrt(cx * cx + cy * cy);
  }

  // "2026-09-27T20:43:12.5-05:00" -> "27/09/26 - 20:43"
  function fechaCorta(iso) {
    if (!iso) { return '—'; }
    var t = iso.split('T'), f = t[0].split('-');
    return f[2] + '/' + f[1] + '/' + f[0].slice(2) + ' - ' + (t[1] || '00:00').slice(0, 5);
  }
  // "2026-09-27T20:43:12.5-05:00" -> "27/09/2026 20:43:12"
  function fechaLarga(iso) {
    if (!iso) { return '—'; }
    var t = iso.split('T'), f = t[0].split('-');
    return f[2] + '/' + f[1] + '/' + f[0] + ' ' + (t[1] || '00:00:00').slice(0, 8);
  }
  // "2026-09-27" -> "27/09/2026"
  function fechaSola(f) {
    if (!f || f.indexOf('-') < 0) { return f || '—'; }
    var p = f.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  // Radio de las zonas: el deslizador (0-100) se convierte en metros con
  // una escala logarítmica, de 100 m a 40 km — así hay precisión tanto
  // para zonas pequeñas como para zonas grandes. (Con el valor inicial 27
  // el radio es 500 m.)
  function radioDesdeSlider(v) {
    var m = 100 * Math.pow(400, v / 100);
    return m < 1000 ? Math.round(m / 10) * 10 : Math.round(m / 100) * 100;
  }
  function textoRadio(m) {
    return m < 1000 ? m + ' m' : (m / 1000).toFixed(1).replace('.0', '') + ' km';
  }

  // Tramos de una ruta que caen dentro de un círculo. Devuelve una lista
  // de {desde, hasta} con los ÍNDICES de puntos consecutivos dentro de la
  // zona; cada entrada es una "pasada" (entrar y salir del círculo).
  function calcularPasadas(puntos, lat, lon, radio) {
    var pasadas = [], actual = null;
    for (var i = 0; i < puntos.length; i++) {
      var dentro = distanciaMetros(lat, lon, puntos[i].lat, puntos[i].lon) <= radio;
      if (dentro) {
        if (actual === null) { actual = { desde: i, hasta: i }; } else { actual.hasta = i; }
      } else if (actual !== null) {
        pasadas.push(actual);
        actual = null;
      }
    }
    if (actual !== null) { pasadas.push(actual); }
    return pasadas;
  }

  // Colores para distinguir rutas entre sí en el mapa.
  var COLORES_RUTA = ['#E4572E', '#2E86AB', '#3B7D23', '#F2A900', '#7A3E9D',
                      '#17BEBB', '#C2185B', '#8D6E63', '#5C6BC0', '#607D8B'];

  // =====================================================================
  // 2. MENÚ LATERAL Y CAMBIO ENTRE TIEMPO REAL / HISTÓRICOS
  // =====================================================================

  var modoActual = 'tiempo-real';

  function alternarMenu(abrir) {
    var nuevo = (typeof abrir === 'boolean') ? abrir : !document.body.classList.contains('menu-abierto');
    document.body.classList.toggle('menu-abierto', nuevo);
    porId('boton-menu').setAttribute('aria-expanded', nuevo ? 'true' : 'false');
    porId('menu-lateral').setAttribute('aria-hidden', nuevo ? 'false' : 'true');
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { alternarMenu(false); }
  });

  function cambiarVista(vista) {
    modoActual = vista;
    var hist = (vista === 'historicos');
    document.body.classList.toggle('modo-historicos', hist);
    porId('modo-tiempo-real').classList.toggle('activo', !hist);
    porId('modo-historicos').classList.toggle('activo', hist);
    porId('titulo-modo-texto').textContent = hist ? 'Históricos' : 'LIVE';
    porId('seccion-historicos').hidden = !hist;

    if (hist) {
      if (mapaHistorico === null) {
        // El mapa histórico se crea la PRIMERA vez que se entra: así no
        // se descargan mapas que quizá nunca se usen.
        inicializarHistoricos();
      } else {
        mapaHistorico.invalidateSize();
        cargarRangoFechas();
        if (tipoFiltro === null && vistaActual === 'lista') { mostrarUltimasRutas(); }
      }
    } else {
      cancelarArmado();
      alternarMenu(false);          // al volver a Tiempo Real se ve todo el mapa
      mapa.invalidateSize();
      actualizarValores();
      actualizarRecorrido();
    }
  }

  // =====================================================================
  // 3. TIEMPO REAL
  // =====================================================================

  var mapa = L.map('mapa', { zoomControl: false }).setView([4.5, -74.3], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(mapa);
  L.control.zoom({ position: 'bottomright' }).addTo(mapa);

  var iconoCamion = L.divIcon({
    html: '🚚',
    className: 'icono-camion',
    iconSize: [36, 36],
    iconAnchor: [18, 18]
  });

  var marcador = null;

  // La línea del recorrido en curso — empieza vacía y se va llenando.
  var linea = L.polyline([], {
    color: '#0B1F3A',
    weight: 4,
    opacity: 0.85,
    lineJoin: 'round'
  }).addTo(mapa);

  function destellar(id) {
    var caja = porId(id);
    caja.classList.add('actualizado');
    setTimeout(function () { caja.classList.remove('actualizado'); }, 700);
  }

  function actualizarValores() {
    fetch('/datos')
      .then(function (respuesta) { return respuesta.json(); })
      .then(function (datos) {
        porId('lat').innerText = datos.lat;
        porId('lon').innerText = datos.lon;
        porId('fecha').innerText = datos.fecha;
        porId('hora').innerText = datos.hora;
        ['lat', 'lon', 'fecha', 'hora'].forEach(destellar);

        // El nombre viaja desde el servidor (nombre.txt, propio de cada
        // instancia) — así cada uno ve su propio nombre en la pestaña.
        if (datos.nombre) {
          document.title = datos.nombre + ' · Orbita';
        }

        var lat = parseFloat(datos.lat);
        var lon = parseFloat(datos.lon);
        if (!isNaN(lat) && !isNaN(lon)) {
          var posicion = [lat, lon];
          if (marcador === null) {
            // Primera ubicación real: crea el marcador y acerca el mapa.
            marcador = L.marker(posicion, { icon: iconoCamion }).addTo(mapa);
            mapa.setView(posicion, 15);
          } else {
            marcador.setLatLng(posicion);
            // El mapa se centra en el camión en CADA actualización, pero
            // conservando el zoom que el usuario tenga en ese momento.
            mapa.setView(posicion, mapa.getZoom());
          }
        }
      })
      .catch(function (e) { console.error(e); });
  }

  // Trae TODOS los puntos del recorrido actual y redibuja la línea completa.
  function actualizarRecorrido() {
    fetch('/recorrido')
      .then(function (respuesta) { return respuesta.json(); })
      .then(function (puntos) {
        var coordenadas = puntos.map(function (p) { return [p.lat, p.lon]; });
        linea.setLatLngs(coordenadas);
      })
      .catch(function (e) { console.error(e); });
  }

  function centrarEnVehiculo() {
    if (marcador) {
      var zoomActual = mapa.getZoom();
      mapa.setView(marcador.getLatLng(), zoomActual < 13 ? 15 : zoomActual);
    }
  }

  // Actualización cada 5 segundos — solo mientras se está viendo Tiempo Real.
  // (Con la pestaña oculta, o el celular bloqueado, no se consulta nada:
  // ahorra batería y datos. Al volver se actualiza de inmediato.)
  setInterval(function () {
    if (modoActual === 'tiempo-real' && !document.hidden) {
      actualizarValores();
      actualizarRecorrido();
    }
  }, 5000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && modoActual === 'tiempo-real') {
      actualizarValores();
      actualizarRecorrido();
    }
  });

  actualizarValores();
  actualizarRecorrido();

  // Cuando la ventana cambia de tamaño (girar el celular, etc.) hay que
  // avisarle a Leaflet que vuelva a medir sus mapas.
  setTimeout(function () { mapa.invalidateSize(); }, 150);
  window.addEventListener('resize', function () {
    mapa.invalidateSize();
    if (mapaHistorico) { mapaHistorico.invalidateSize(); }
  });

  // =====================================================================
  // 4. HISTÓRICOS — estado
  // =====================================================================

  var mapaHistorico = null;
  var capaRutas, capaTramosResultado, capaZona, capaDetalle, capaSub, capaSubZona;   // grupos de capas del mapa

  var vistaActual = 'lista';      // 'lista' | 'detalle'
  var tipoFiltro = null;          // null | 'fecha' | 'zona'   (primer filtrado)
  var subTipo = null;             // null | 'tiempo' | 'zona'  (segundo filtrado, dentro de la ruta)

  var tokenBusqueda = 0;          // evita que una respuesta lenta pise a una más nueva
  var rutasActuales = [];         // resúmenes de las rutas que se están mostrando
  var ETIQUETA_ULTIMAS = 'Últimas 4 rutas';      // rótulo de la primera vista de Históricos
  var etiquetaBase = ETIQUETA_ULTIMAS, vacioBase = '';
  var subconjuntoActivo = false;  // ¿la lista muestra solo las rutas de un trayecto coincidente?
  var colorPorId = {}, puntosPorId = {}, horasPorId = {}, lineasPorId = {};

  var rutaSel = null;             // { resumen, puntos, color } de la ruta abierta en el detalle
  var lineaDetalle = null, marcadorInicio = null, marcadorFin = null, marcadorSlider = null;

  // Zonas (círculos): una para el primer filtrado y otra para el filtrado dentro de la ruta.
  var zonaP = { centro: null, radio: 500, circulo: null };
  var zonaS = { centro: null, radio: 500, circulo: null };
  var armado = null;              // null | 'principal' | 'sub' — el próximo clic en el mapa coloca la zona (solo la primera vez)
  var AYUDA_COLOCAR = 'Toca el mapa para colocar la zona.';
  var AYUDA_MOVER = 'Mantén presionado el círculo y arrástralo para moverlo. Al soltarlo se muestran los tramos.';

  function inicializarHistoricos() {
    mapaHistorico = L.map('mapa-historico', { zoomControl: false, preferCanvas: true }).setView([4.5, -74.3], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19
    }).addTo(mapaHistorico);
    L.control.zoom({ position: 'bottomright' }).addTo(mapaHistorico);

    capaRutas = L.layerGroup().addTo(mapaHistorico);
    capaTramosResultado = L.layerGroup().addTo(mapaHistorico);
    capaZona = L.layerGroup().addTo(mapaHistorico);
    capaDetalle = L.layerGroup().addTo(mapaHistorico);
    capaSub = L.layerGroup().addTo(mapaHistorico);
    capaSubZona = L.layerGroup().addTo(mapaHistorico);

    mapaHistorico.on('click', alClicMapaHistorico);
    configurarArrastreDeZonas();

    cambiarRadio(porId('radio-zona').value, 'principal');
    cambiarRadio(porId('sub-radio').value, 'sub');
    cargarRangoFechas();
    mostrarUltimasRutas();
  }

  // El calendario no deja escoger fechas sin datos.
  function cargarRangoFechas() {
    pedirJSON('/recorridos_rango').then(function (rg) {
      ['filtro-inicio', 'filtro-fin'].forEach(function (id) {
        var campo = porId(id);
        if (rg.min && rg.max) {
          campo.min = rg.min.slice(0, 16);
          campo.max = rg.max.slice(0, 16);
        } else {
          campo.removeAttribute('min');
          campo.removeAttribute('max');
        }
      });
    }).catch(function (e) { console.error(e); });
  }

  // Deja espacio en el mapa para el menú cuando se ajusta la vista a una ruta.
  function opcionesAjuste() {
    var abierto = document.body.classList.contains('menu-abierto');
    var conSlider = document.body.classList.contains('ruta-abierta');   // el slider flotante tapa la parte baja
    var w = window.innerWidth, h = window.innerHeight;
    if (!abierto) { return { paddingTopLeft: [70, 70], paddingBottomRight: [70, conSlider ? 100 : 70], maxZoom: 17 }; }
    if (w <= 720) {
      // La hoja inferior tapa tanto como mida ahora (más lo que la separa del borde).
      var menu = porId('menu-lateral');
      var tapado = menu.offsetHeight + (parseFloat(getComputedStyle(menu).bottom) || 0) + 16;
      return { paddingTopLeft: [30, 70], paddingBottomRight: [30, Math.min(tapado, Math.round(h * 0.7))], maxZoom: 17 };
    }
    return { paddingTopLeft: [400, 80], paddingBottomRight: [50, conSlider ? 100 : 50], maxZoom: 17 };
  }

  function unirBounds(lista) {
    var acc = null;
    lista.forEach(function (b) {
      if (!b || !b.isValid()) { return; }
      if (acc === null) { acc = L.latLngBounds(b.getSouthWest(), b.getNorthEast()); }
      else { acc.extend(b); }
    });
    return acc;
  }

  // =====================================================================
  // 5. HISTÓRICOS — primer filtrado: lista de rutas
  // =====================================================================

  function mostrarUltimasRutas() {
    cargarResultados('/recorridos?limite=4', ETIQUETA_ULTIMAS, 'Todavía no hay rutas registradas.');
  }

  // El botón "Ver todas las rutas registradas" / "Mostrar solo las
  // últimas 4" debajo de la lista: alterna entre los dos según cuál
  // esté mostrando ahora mismo (etiquetaBase).
  function alternarTodasLasRutas() {
    if (etiquetaBase === 'Todas las rutas registradas') {
      mostrarUltimasRutas();
    } else {
      cargarResultados('/recorridos?limite=todas', 'Todas las rutas registradas', 'Todavía no hay rutas registradas.');
    }
  }

  // Muestra/oculta y rotula ese botón. Solo tiene sentido en las dos
  // vistas "sin filtro real" (últimas rutas / todas); con un filtro de
  // fecha o zona aplicado, o con un subconjunto de rutas coincidentes,
  // se oculta.
  function actualizarBotonVerTodas(etiqueta) {
    var btn = porId('btn-ver-todas');
    if (etiqueta === ETIQUETA_ULTIMAS) {
      btn.hidden = false;
      btn.textContent = 'Ver todas las rutas registradas';
    } else if (etiqueta === 'Todas las rutas registradas') {
      btn.hidden = false;
      btn.textContent = 'Mostrar solo las últimas 4';
    } else {
      btn.hidden = true;
    }
  }

  // Pide una lista de rutas al servidor, la muestra como tarjetas y
  // dibuja TODAS en el mapa, cada una de un color.
  //
  // "opciones" (todas opcionales) es lo que usa el filtro por zona, que se
  // vuelve a ejecutar cada vez que se suelta el círculo:
  //   suave:   no borra lo dibujado ni pone "Cargando…" hasta tener lo nuevo
  //            (así el mapa no parpadea al mover el círculo)
  //   ajustar: false = no mover la vista del mapa (el usuario está mirando la zona)
  //   avisar:  muestra el resultado en el aviso flotante sobre el mapa
  function limpiarDibujoResultados() {
    capaRutas.clearLayers();
    capaTramosResultado.clearLayers();
    lineasPorId = {};
    puntosPorId = {};
    horasPorId = {};
  }

  function cargarResultados(url, etiqueta, mensajeVacio, opciones) {
    opciones = opciones || {};
    var token = ++tokenBusqueda;
    etiquetaBase = etiqueta;
    vacioBase = mensajeVacio;
    subconjuntoActivo = false;
    porId('etiqueta-resultados').textContent = etiqueta;
    porId('accion-lista').hidden = true;
    actualizarBotonVerTodas(etiqueta);
    if (!opciones.suave) {
      limpiarDibujoResultados();
      porId('lista-recorridos').innerHTML = '<div class="lista-vacia">Cargando…</div>';
    }

    pedirJSON(url).then(function (lista) {
      if (token !== tokenBusqueda) { return; }
      rutasActuales = lista;
      colorPorId = {};
      lista.forEach(function (r, i) { colorPorId[r.id_recorrido] = COLORES_RUTA[i % COLORES_RUTA.length]; });
      renderizarTarjetas(lista, mensajeVacio);
      dibujarRutasEnMapa(lista, token, opciones);
      if (opciones.avisar) {
        mostrarAvisoMapa(lista.length === 0 ? mensajeVacio
          : (lista.length === 1 ? '1 ruta pasa por esta zona' : lista.length + ' rutas pasan por esta zona'));
      }
      // En celular el menú es corto: si los resultados quedaron más abajo
      // de lo visible, se baja hasta la primera tarjeta.
      var primera = porId('lista-recorridos').firstElementChild;
      if (primera && primera.scrollIntoView) { primera.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    }).catch(function (e) {
      console.error(e);
      if (token !== tokenBusqueda) { return; }
      porId('lista-recorridos').innerHTML = '<div class="lista-vacia">No se pudieron cargar las rutas. Intenta de nuevo.</div>';
    });
  }

  function renderizarTarjetas(lista, mensajeVacio) {
    var contenedor = porId('lista-recorridos');
    contenedor.innerHTML = '';
    if (lista.length === 0) {
      var vacio = document.createElement('div');
      vacio.className = 'lista-vacia';
      vacio.textContent = mensajeVacio;
      contenedor.appendChild(vacio);
      return;
    }
    lista.forEach(function (r) {
      var tarjeta = document.createElement('div');
      tarjeta.className = 'tarjeta-recorrido';
      tarjeta.tabIndex = 0;
      tarjeta.setAttribute('role', 'button');
      tarjeta.dataset.id = r.id_recorrido;
      tarjeta.style.borderLeftColor = colorPorId[r.id_recorrido] || '#A7B1BE';
      tarjeta.title = r.num_puntos + ' puntos';
      tarjeta.innerHTML =
        '<div class="tarjeta-linea"><span class="tarjeta-etq">Desde</span><span class="tarjeta-val">' + fechaCorta(r.hora_recepcion_inicio) + '</span></div>' +
        '<div class="tarjeta-linea"><span class="tarjeta-etq">Hasta</span><span class="tarjeta-val">' + fechaCorta(r.hora_recepcion_fin) + '</span></div>';
      tarjeta.addEventListener('click', function () { seleccionarRecorrido(r.id_recorrido); });
      tarjeta.addEventListener('keydown', function (e) { if (e.key === 'Enter') { seleccionarRecorrido(r.id_recorrido); } });
      tarjeta.addEventListener('mouseenter', function () { resaltarRutas([r.id_recorrido]); });
      tarjeta.addEventListener('mouseleave', function () { restaurarResaltado(); });
      contenedor.appendChild(tarjeta);
    });
  }

  // Trae la geometría de todas las rutas de la lista en UNA sola
  // petición y las dibuja, cada una de su color.
  function dibujarRutasEnMapa(lista, token, opciones) {
    opciones = opciones || {};
    if (lista.length === 0) {
      if (opciones.suave) { limpiarDibujoResultados(); }
      if (opciones.ajustar !== false) { ajustarAResultados(); }
      return;
    }
    var ids = lista.map(function (r) { return r.id_recorrido; });
    var maxPuntos = Math.max.apply(null, lista.map(function (r) { return r.num_puntos; }));
    // Para una vista general no hace falta cada punto: ~300 por ruta basta.
    var paso = Math.max(1, Math.ceil(maxPuntos / 300));

    pedirJSON('/puntos_recorridos?ids=' + encodeURIComponent(ids.join(',')) + '&paso=' + paso).then(function (porRuta) {
      if (token !== tokenBusqueda) { return; }
      if (opciones.suave) { limpiarDibujoResultados(); }      // recién ahora: sin parpadeo
      lista.forEach(function (r) {
        var datos = porRuta[r.id_recorrido];
        if (!datos || !datos.pts || datos.pts.length === 0) { return; }
        puntosPorId[r.id_recorrido] = datos.pts;
        horasPorId[r.id_recorrido] = datos.horas;
        lineasPorId[r.id_recorrido] = L.polyline(datos.pts, {
          color: colorPorId[r.id_recorrido], weight: 5, opacity: 0.9, lineJoin: 'round',
          interactive: false        // los clics los atiende el mapa (ver alClicMapaHistorico)
        }).addTo(capaRutas);
      });
      if (opciones.ajustar !== false) { ajustarAResultados(); }
      resaltarTramosDelFiltro();
    }).catch(function (e) { console.error(e); });
  }

  // Con un filtro por fecha o por zona activo (primer filtrado), resalta
  // DE UNA VEZ, sobre cada ruta del resultado, el tramo que cae dentro
  // de ese filtro — sin tener que abrir ninguna ruta. Usa los puntos ya
  // descargados para dibujar la lista (puntosPorId/horasPorId), que son
  // una versión reducida de la ruta: por eso, al abrir una ruta en
  // concreto, el tramo se vuelve a calcular con toda su resolución
  // (ver heredarFiltroPrimario).
  function resaltarTramosDelFiltro() {
    capaTramosResultado.clearLayers();
    if (tipoFiltro === 'zona' && zonaP.centro) {
      rutasActuales.forEach(function (r) {
        var pts = puntosPorId[r.id_recorrido];
        if (!pts) { return; }
        pasadasEnArray(pts, zonaP.centro.lat, zonaP.centro.lng, zonaP.radio).forEach(function (p) {
          dibujarTramoEnCapa(capaTramosResultado, pts.slice(p.desde, p.hasta + 1), colorPorId[r.id_recorrido]);
        });
      });
    } else if (tipoFiltro === 'fecha') {
      var desde = porId('filtro-inicio').value;
      var finCampo = porId('filtro-fin').value;
      if (!desde && !finCampo) { return; }
      var hasta = finCampo ? finCampo + ':59.999999' : '\uffff';
      rutasActuales.forEach(function (r) {
        var pts = puntosPorId[r.id_recorrido], horas = horasPorId[r.id_recorrido];
        if (!pts || !horas) { return; }
        var rango = rangoFechaEnArray(horas, desde || '', hasta);
        if (rango) { dibujarTramoEnCapa(capaTramosResultado, pts.slice(rango.desde, rango.hasta + 1), colorPorId[r.id_recorrido]); }
      });
    }
  }

  // Dibuja un tramo resaltado (línea gruesa con halo + marcadores en los
  // extremos) en la capa indicada, con las coordenadas [lat, lon] dadas.
  // La comparten el resaltado de la lista (varias rutas) y el resaltado
  // de una ruta abierta en el detalle (dibujarTramo).
  function dibujarTramoEnCapa(capa, coords, color) {
    var base = { lineCap: 'round', lineJoin: 'round', interactive: false };
    L.polyline(coords, Object.assign({ color: '#0B1F3A', weight: 16, opacity: 0.85 }, base)).addTo(capa);
    L.polyline(coords, Object.assign({ color: color, weight: 8, opacity: 1 }, base)).addTo(capa);
    var estilo = { radius: 7, color: '#0B1F3A', weight: 3, fillColor: '#E6E9EF', fillOpacity: 1, interactive: false };
    L.circleMarker(coords[0], estilo).addTo(capa);
    if (coords.length > 1) { L.circleMarker(coords[coords.length - 1], estilo).addTo(capa); }
    return L.latLngBounds(coords);
  }

  // Igual que calcularPasadas (más abajo), pero para puntos [lat, lon]
  // en vez de objetos {lat, lon}: los que trae la vista de lista.
  function pasadasEnArray(pts, lat, lon, radio) {
    var pasadas = [], actual = null;
    for (var i = 0; i < pts.length; i++) {
      var dentro = distanciaMetros(lat, lon, pts[i][0], pts[i][1]) <= radio;
      if (dentro) {
        if (actual === null) { actual = { desde: i, hasta: i }; } else { actual.hasta = i; }
      } else if (actual !== null) {
        pasadas.push(actual);
        actual = null;
      }
    }
    if (actual !== null) { pasadas.push(actual); }
    return pasadas;
  }

  // Busca, dentro de "horas" (mismos índices que sus puntos), el tramo
  // CONTIGUO cuyo instante cae en [desde, hasta] (texto ISO, se compara
  // igual que en aplicarSubTiempo). null si ninguno cae en el rango.
  function rangoFechaEnArray(horas, desde, hasta) {
    var primero = -1, ultimo = -1;
    for (var i = 0; i < horas.length; i++) {
      var t = horas[i];
      if (t >= desde && t <= hasta) { if (primero < 0) { primero = i; } ultimo = i; }
    }
    return primero < 0 ? null : { desde: primero, hasta: ultimo };
  }

  function ajustarAResultados() {
    if (vistaActual !== 'lista' || !mapaHistorico) { return; }
    var lista = Object.keys(lineasPorId).map(function (k) { return lineasPorId[k].getBounds(); });
    if (zonaP.circulo) { lista.push(zonaP.circulo.getBounds()); }
    var u = unirBounds(lista);
    if (u) { mapaHistorico.fitBounds(u, opcionesAjuste()); }
  }

  // Resaltado de rutas en el mapa
  // Las rutas resaltadas se dibujan con grosores escalonados (la primera
  // más gruesa, las siguientes más delgadas y encima): así, si varias
  // comparten el mismo trayecto, se ven TODOS sus colores como un cable.
  function resaltarRutas(ids) {
    var k = 0;
    rutasActuales.forEach(function (r) {
      var linea = lineasPorId[r.id_recorrido];
      if (!linea) { return; }
      if (ids.indexOf(r.id_recorrido) >= 0) {
        var grosor = ids.length === 1 ? 8 : Math.max(4, 13 - 3 * k);
        k++;
        linea.setStyle({ weight: grosor, opacity: 1 });
        linea.bringToFront();
      } else {
        linea.setStyle({ weight: 4, opacity: 0.25 });
      }
    });
  }
  function quitarResaltado() {
    Object.keys(lineasPorId).forEach(function (id) { lineasPorId[id].setStyle({ weight: 5, opacity: 0.9 }); });
  }
  function restaurarResaltado() {
    if (subconjuntoActivo) { resaltarRutas(idsDelSubconjunto); } else { quitarResaltado(); }
  }

  // ---- Filtro por fecha ----

  function elegirTipoFiltro(tipo) {
    tipoFiltro = (tipoFiltro === tipo) ? null : tipo;
    porId('tf-fecha').classList.toggle('activo', tipoFiltro === 'fecha');
    porId('tf-zona').classList.toggle('activo', tipoFiltro === 'zona');
    porId('panel-fecha').hidden = tipoFiltro !== 'fecha';
    porId('panel-zona').hidden = tipoFiltro !== 'zona';
    desarmar();
    limpiarFiltros();
  }

  function aplicarFiltroFecha() {
    var ini = porId('filtro-inicio').value, fin = porId('filtro-fin').value;
    var aviso = porId('aviso-fecha');
    aviso.textContent = '';
    if (!ini && !fin) { aviso.textContent = 'Elige una fecha y hora de inicio, de fin, o ambas.'; return; }
    if (ini && fin && ini > fin) { aviso.textContent = 'El fin debe ser posterior al inicio.'; return; }
    var url = '/recorridos?limite=30' +
              (ini ? '&desde=' + encodeURIComponent(ini) : '') +
              (fin ? '&hasta=' + encodeURIComponent(fin) : '');
    cargarResultados(url, 'Rutas en ese rango', 'No hay rutas en ese rango de tiempo.');
  }

  // ---- Filtro por zona ----

  // Ya no hay botón "Buscar": se ejecuta sola al colocar el círculo, al
  // soltarlo después de arrastrarlo y al cambiar el radio (ver
  // ejecutarBusquedaZona). Sin mover la vista del mapa.
  function aplicarFiltroZona() {
    if (!zonaP.centro) { return; }
    var url = '/recorridos_zona?lat=' + zonaP.centro.lat + '&lon=' + zonaP.centro.lng +
              '&radio=' + zonaP.radio + '&limite=30';
    cargarResultados(url, 'Rutas por el área', 'No hay rutas en este área seleccionada.',
                     { suave: true, ajustar: false, avisar: true });
  }

  // "Limpiar" (y cambiar de tipo de filtro): vuelve a las últimas 4 rutas.
  function limpiarFiltros() {
    cancelarBusquedasZona();
    porId('filtro-inicio').value = '';
    porId('filtro-fin').value = '';
    porId('aviso-fecha').textContent = '';
    capaZona.clearLayers();
    zonaP.centro = null;
    zonaP.circulo = null;
    porId('ayuda-zona').textContent = AYUDA_COLOCAR;
    mostrarUltimasRutas();
    if (tipoFiltro === 'zona') { armarCentro('principal'); }
  }

  // =====================================================================
  // 6. HISTÓRICOS — círculos (zonas)
  // =====================================================================

  // interactive:false = el círculo no captura clics (las rutas de debajo siguen
  // respondiendo). Moverlo lo hace configurarArrastreDeZonas, no Leaflet.
  function estiloCirculo(ambito) {
    return ambito === 'principal'
      ? { color: '#0B1F3A', weight: 3, dashArray: '8 6', fillColor: '#0B1F3A', fillOpacity: 0.12, interactive: false }
      : { color: '#0B1F3A', weight: 3, fillColor: '#E6E9EF', fillOpacity: 0.3, interactive: false };
  }

  // "Armar" = esperar el PRÓXIMO clic en el mapa para colocar la zona. Solo
  // pasa cuando todavía no hay círculo; una vez colocado, se mueve arrastrándolo.
  function armarCentro(ambito) {
    armado = ambito;
    mapaHistorico.getContainer().classList.add('armado');
    porId(ambito === 'principal' ? 'ayuda-zona' : 'ayuda-sub-zona').textContent = AYUDA_COLOCAR;
  }
  function desarmar() {
    armado = null;
    if (mapaHistorico) { mapaHistorico.getContainer().classList.remove('armado'); }
  }
  function cancelarArmado() { desarmar(); }

  function colocarCentro(latlng) {
    var ambito = armado;
    var principal = (ambito === 'principal');
    var z = principal ? zonaP : zonaS;
    var capa = principal ? capaZona : capaSubZona;
    z.centro = latlng;
    if (!z.circulo) {
      var opciones = estiloCirculo(ambito);
      opciones.radius = z.radio;
      z.circulo = L.circle(latlng, opciones).addTo(capa);
    } else {
      z.circulo.setLatLng(latlng);
    }
    porId(principal ? 'ayuda-zona' : 'ayuda-sub-zona').textContent = AYUDA_MOVER;
    desarmar();
    ejecutarBusquedaZona(ambito);          // se filtra de una vez, sin botón
  }

  function cambiarRadio(valor, ambito) {
    var m = radioDesdeSlider(Number(valor));
    var z = (ambito === 'principal') ? zonaP : zonaS;
    z.radio = m;
    porId(ambito === 'principal' ? 'radio-texto' : 'sub-radio-texto').textContent = textoRadio(m);
    if (z.circulo) {
      z.circulo.setRadius(m);
      programarBusquedaZona(ambito);       // el círculo cambia al instante; el filtro, al dejar de mover la barra
    }
  }

  // ---- Filtrar solo al colocar / mover / cambiar el radio de la zona ----

  var temporizadorZona = { principal: null, sub: null };

  function programarBusquedaZona(ambito) {
    clearTimeout(temporizadorZona[ambito]);
    temporizadorZona[ambito] = setTimeout(function () { ejecutarBusquedaZona(ambito); }, 300);
  }
  function cancelarBusquedasZona() {
    clearTimeout(temporizadorZona.principal);
    clearTimeout(temporizadorZona.sub);
  }

  // Un solo punto de entrada. Las comprobaciones evitan que un temporizador
  // viejo busque cuando ya se cambió de vista, de filtro o se quitó la zona.
  function ejecutarBusquedaZona(ambito) {
    clearTimeout(temporizadorZona[ambito]);
    if (ambito === 'principal') {
      if (vistaActual !== 'lista' || tipoFiltro !== 'zona' || !zonaP.centro) { return; }
      aplicarFiltroZona();
    } else {
      if (vistaActual !== 'detalle' || subTipo !== 'zona' || !zonaS.centro) { return; }
      aplicarSubZona({ ajustar: false, avisar: true });
    }
  }

  // ---- Mover el círculo: clic (o dedo) sostenido sobre él y arrastrar ----
  // Se hace con eventos "pointer" directamente sobre el contenedor del mapa
  // (valen para mouse, dedo y lápiz). Al presionar DENTRO del círculo se
  // apaga el arrastre del mapa para que se mueva el círculo y no el mapa;
  // al soltar se vuelve a encender y se ejecuta el filtro. Presionar fuera
  // del círculo mueve el mapa como siempre.

  var arrastre = null;        // { ambito, zona, id, x0, y0, inicio, centroInicial, movido } mientras se arrastra
  var ultimoArrastre = 0;     // cuándo terminó el último arrastre real: se ignora el clic que el navegador dispara después

  function zonaMovibleAhora() {
    if (armado) { return null; }
    if (vistaActual === 'lista' && tipoFiltro === 'zona' && zonaP.circulo) { return { ambito: 'principal', zona: zonaP }; }
    if (vistaActual === 'detalle' && subTipo === 'zona' && zonaS.circulo) { return { ambito: 'sub', zona: zonaS }; }
    return null;
  }

  // ¿El puntero está sobre el círculo? Si el círculo se ve muy pequeño se
  // da un mínimo de 22 px para poder agarrarlo con el dedo.
  function punteroSobreZona(e, zona) {
    var metrosPorPx = 156543.03392 * Math.cos(zona.centro.lat * Math.PI / 180) / Math.pow(2, mapaHistorico.getZoom());
    var radioPx = Math.max(zona.radio / metrosPorPx, 22);
    var centro = mapaHistorico.latLngToContainerPoint(zona.centro);
    return centro.distanceTo(mapaHistorico.mouseEventToContainerPoint(e)) <= radioPx;
  }

  function configurarArrastreDeZonas() {
    var contenedor = mapaHistorico.getContainer();
    contenedor.addEventListener('pointerdown', alPresionarMapa, true);
    contenedor.addEventListener('pointermove', alPasarPunteroPorMapa);
    contenedor.addEventListener('pointerleave', function () { contenedor.classList.remove('sobre-zona'); });
  }

  function alPresionarMapa(e) {
    if (arrastre) {                                   // un segundo dedo (zoom con dos dedos): se suelta el círculo
      if (e.pointerId !== arrastre.id) { terminarArrastre(); }
      return;
    }
    if (!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) { return; }
    if (e.target.closest && e.target.closest('.leaflet-control')) { return; }
    var info = zonaMovibleAhora();
    if (!info || !punteroSobreZona(e, info.zona)) { return; }

    arrastre = {
      ambito: info.ambito, zona: info.zona, id: e.pointerId,
      x0: e.clientX, y0: e.clientY, movido: false,
      inicio: mapaHistorico.mouseEventToLayerPoint(e),
      centroInicial: mapaHistorico.latLngToLayerPoint(info.zona.centro)
    };
    mapaHistorico.dragging.disable();                 // desde ahora el mapa no se mueve con este gesto
    mapaHistorico.getContainer().classList.remove('sobre-zona');
    mapaHistorico.getContainer().classList.add('arrastrando-zona');
    window.addEventListener('pointermove', alMoverPuntero);
    window.addEventListener('pointerup', alSoltarPuntero);
    window.addEventListener('pointercancel', alSoltarPuntero);
    window.addEventListener('blur', terminarArrastre);     // seguro: si la ventana pierde el foco a mitad de arrastre, se suelta
  }

  function alMoverPuntero(e) {
    if (!arrastre || e.pointerId !== arrastre.id) { return; }
    // Seguro: si el botón del mouse ya se soltó (p. ej. fuera de la ventana) y no llegó el "pointerup",
    // se termina aquí; si no, el mapa se quedaría sin poder arrastrarse.
    if (e.pointerType === 'mouse' && e.buttons === 0) { terminarArrastre(); return; }
    // Un toque casi quieto no cuenta como arrastre (así un clic normal sigue siendo un clic).
    if (!arrastre.movido && Math.abs(e.clientX - arrastre.x0) + Math.abs(e.clientY - arrastre.y0) < 5) { return; }
    arrastre.movido = true;
    // El círculo se desplaza lo mismo que el puntero desde donde se agarró (no salta a centrarse en el dedo).
    var actual = mapaHistorico.mouseEventToLayerPoint(e);
    var nuevo = mapaHistorico.layerPointToLatLng(arrastre.centroInicial.add(actual.subtract(arrastre.inicio)));
    arrastre.zona.centro = nuevo;
    arrastre.zona.circulo.setLatLng(nuevo);
  }

  function alSoltarPuntero(e) {
    if (arrastre && e.pointerId === arrastre.id) { terminarArrastre(); }
  }

  function terminarArrastre() {
    var a = arrastre;
    if (!a) { return; }
    arrastre = null;
    window.removeEventListener('pointermove', alMoverPuntero);
    window.removeEventListener('pointerup', alSoltarPuntero);
    window.removeEventListener('pointercancel', alSoltarPuntero);
    window.removeEventListener('blur', terminarArrastre);
    mapaHistorico.dragging.enable();
    mapaHistorico.getContainer().classList.remove('arrastrando-zona');
    if (a.movido) {
      ultimoArrastre = Date.now();
      ejecutarBusquedaZona(a.ambito);                 // soltó el círculo: se muestran los tramos
    }
  }

  // Con el mouse: cursor de "mover" al pasar por encima del círculo.
  function alPasarPunteroPorMapa(e) {
    if (arrastre || e.pointerType !== 'mouse') { return; }
    var info = zonaMovibleAhora();
    mapaHistorico.getContainer().classList.toggle('sobre-zona', !!(info && punteroSobreZona(e, info.zona)));
  }

  // =====================================================================
  // 7. HISTÓRICOS — clic en el mapa
  // =====================================================================

  function alClicMapaHistorico(e) {
    if (Date.now() - ultimoArrastre < 350) { return; }     // es el clic que sigue a soltar el círculo
    if (armado) { colocarCentro(e.latlng); return; }
    if (vistaActual !== 'lista') { return; }     // en el detalle solo responde la línea de la ruta

    var ids = rutasBajoClic(e.latlng, 12);
    if (ids.length === 0) {
      if (subconjuntoActivo) { restaurarLista(); }
    } else if (ids.length === 1) {
      seleccionarRecorrido(ids[0]);                // igual que hacer clic en su tarjeta
    } else {
      mostrarCoincidencias(ids);                   // varias rutas superpuestas: elegir cuál
    }
  }

  // ¿Qué rutas pasan a menos de `tolPx` píxeles del punto donde se hizo clic?
  function rutasBajoClic(latlng, tolPx) {
    var zoom = mapaHistorico.getZoom();
    var metrosPorPx = 156543.03392 * Math.cos(latlng.lat * Math.PI / 180) / Math.pow(2, zoom);
    var tol = tolPx * metrosPorPx;
    var aciertos = [];
    rutasActuales.forEach(function (r) {
      var pts = puntosPorId[r.id_recorrido];
      if (!pts) { return; }
      if (pts.length === 1) {
        if (distanciaMetros(latlng.lat, latlng.lng, pts[0][0], pts[0][1]) <= tol) { aciertos.push(r.id_recorrido); }
        return;
      }
      for (var i = 1; i < pts.length; i++) {
        if (distPuntoSegmentoM(latlng.lat, latlng.lng, pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]) <= tol) {
          aciertos.push(r.id_recorrido);
          return;
        }
      }
    });
    return aciertos;
  }

  var idsDelSubconjunto = [];

  // Varias rutas comparten el trayecto donde se hizo clic: la lista pasa
  // a mostrar SOLO las tarjetas de esas rutas.
  function mostrarCoincidencias(ids) {
    subconjuntoActivo = true;
    idsDelSubconjunto = ids;
    resaltarRutas(ids);
    porId('etiqueta-resultados').textContent = 'Rutas que coinciden en este trayecto';
    porId('accion-lista').hidden = false;
    porId('btn-ver-todas').hidden = true;
    renderizarTarjetas(rutasActuales.filter(function (r) { return ids.indexOf(r.id_recorrido) >= 0; }), '');
    alternarMenu(true);
  }

  // Vuelve a mostrar todas las rutas del resultado.
  function restaurarLista() {
    subconjuntoActivo = false;
    idsDelSubconjunto = [];
    quitarResaltado();
    porId('etiqueta-resultados').textContent = etiquetaBase;
    porId('accion-lista').hidden = true;
    actualizarBotonVerTodas(etiquetaBase);
    renderizarTarjetas(rutasActuales, vacioBase);
  }

  // =====================================================================
  // 8. HISTÓRICOS — detalle de UNA ruta
  // =====================================================================

  function seleccionarRecorrido(id) {
    var resumen = null;
    rutasActuales.forEach(function (r) { if (r.id_recorrido === id) { resumen = r; } });
    if (!resumen) { return; }

    rutaSel = { resumen: resumen, puntos: null, color: colorPorId[id] || '#5B21B6' };
    desarmar();
    cancelarBusquedasZona();
    vistaActual = 'detalle';
    document.body.classList.add('ruta-abierta');       // muestra el slider flotante
    porId('vista-lista').hidden = true;
    porId('vista-detalle').hidden = false;
    porId('menu-cuerpo').scrollTop = 0;
    // Al abrir el detalle se ocultan las rutas del resultado, sus tramos
    // resaltados y el círculo del primer filtrado: si había un filtro por
    // zona, su círculo se vuelve a dibujar (idéntico) dentro del detalle
    // (ver heredarFiltroPrimario) y dos círculos iguales superpuestos
    // solo estorban.
    if (mapaHistorico.hasLayer(capaRutas)) { mapaHistorico.removeLayer(capaRutas); }
    if (mapaHistorico.hasLayer(capaTramosResultado)) { mapaHistorico.removeLayer(capaTramosResultado); }
    if (mapaHistorico.hasLayer(capaZona)) { mapaHistorico.removeLayer(capaZona); }
    reiniciarSubfiltros();
    rellenarResumen(resumen, rutaSel.color);
    porId('punto-info').hidden = true;
    porId('slider-etiqueta').textContent = '—';
    porId('slider-momento').max = 0;
    porId('slider-momento').value = 0;
    alternarMenu(true);

    pedirJSON('/puntos_recorrido?id=' + encodeURIComponent(id)).then(function (puntos) {
      if (!rutaSel || rutaSel.resumen.id_recorrido !== id) { return; }
      rutaSel.puntos = puntos;
      prepararSubfiltros(puntos);
      dibujarDetalle(puntos, rutaSel.color);
      heredarFiltroPrimario();
    }).catch(function (e) {
      console.error(e);
      porId('aviso-sub').textContent = 'No se pudieron cargar los puntos de esta ruta.';
    });
  }

  // Si la ruta se abrió estando activo un filtro por fecha o por zona
  // (primer filtrado), ESE MISMO filtro se aplica de una vez dentro de
  // la ruta, con sus mismos valores: se resalta al instante el tramo
  // correspondiente, sin obligar a repetir el filtrado ya hecho. Usa la
  // resolución COMPLETA de la ruta (más precisa que el resaltado de la
  // lista, que trabaja con puntos reducidos). El usuario sigue pudiendo
  // quitarlo o cambiarlo a mano con los controles de siempre.
  function heredarFiltroPrimario() {
    if (tipoFiltro === 'fecha') {
      var ini = porId('filtro-inicio').value, fin = porId('filtro-fin').value;
      if (!ini && !fin) { return; }
      subTipo = 'tiempo';
      porId('sf-tiempo').classList.add('activo');
      porId('sub-panel-tiempo').hidden = false;
      porId('sub-inicio').value = ini;
      porId('sub-fin').value = fin;
      aplicarSubTiempo();
    } else if (tipoFiltro === 'zona' && zonaP.centro) {
      subTipo = 'zona';
      porId('sf-zona').classList.add('activo');
      porId('sub-panel-zona').hidden = false;
      zonaS.centro = L.latLng(zonaP.centro.lat, zonaP.centro.lng);
      zonaS.radio = zonaP.radio;
      var opciones = estiloCirculo('sub');
      opciones.radius = zonaS.radio;
      zonaS.circulo = L.circle(zonaS.centro, opciones).addTo(capaSubZona);
      porId('sub-radio').value = porId('radio-zona').value;
      porId('sub-radio-texto').textContent = textoRadio(zonaS.radio);
      porId('ayuda-sub-zona').textContent = AYUDA_MOVER;
      aplicarSubZona();
    }
  }

  function rellenarResumen(r, color) {
    porId('detalle-tarjeta').style.borderLeftColor = color;
    porId('detalle-desde').textContent = fechaCorta(r.hora_recepcion_inicio);
    porId('detalle-hasta').textContent = fechaCorta(r.hora_recepcion_fin);
  }

  function dibujarDetalle(puntos, color) {
    capaDetalle.clearLayers();
    if (puntos.length === 0) { return; }
    var coords = puntos.map(function (p) { return [p.lat, p.lon]; });

    lineaDetalle = L.polyline(coords, { color: color, weight: 6, opacity: 0.95, lineJoin: 'round' }).addTo(capaDetalle);
    // Clic sobre la línea: se toma el punto GPS más cercano al clic y se
    // muestran sus datos exactos (el slider salta a ese punto).
    lineaDetalle.on('click', function (e) {
      if (armado || Date.now() - ultimoArrastre < 350) { return; }
      moverSliderAIndiceReal(indiceMasCercano(e.latlng));
    });

    marcadorInicio = L.circleMarker(coords[0], { radius: 10, color: '#FFFFFF', weight: 3, fillColor: '#0F766E', fillOpacity: 1 }).addTo(capaDetalle);
    marcadorFin = L.circleMarker(coords[coords.length - 1], { radius: 10, color: '#FFFFFF', weight: 3, fillColor: '#C2410C', fillOpacity: 1 }).addTo(capaDetalle);
    marcadorSlider = L.circleMarker(coords[0], { radius: 6, color: '#FFFFFF', weight: 2, fillColor: '#0B1F3A', fillOpacity: 1 }).addTo(capaDetalle);

    configurarSlider(null, 0);      // sin filtro: el slider recorre TODA la ruta

    mapaHistorico.fitBounds(lineaDetalle.getBounds(), opcionesAjuste());
  }

  // Después de dibujar resaltados encima, se reordena para que la línea de
  // la ruta y sus marcadores no queden tapados.
  function reordenarDetalle() {
    if (marcadorInicio) { marcadorInicio.bringToFront(); }
    if (marcadorFin) { marcadorFin.bringToFront(); }
    if (marcadorSlider) { marcadorSlider.bringToFront(); }
  }

  function indiceMasCercano(latlng) {
    var pts = rutaSel.puntos, mejor = 0, mejorD = Infinity;
    for (var i = 0; i < pts.length; i++) {
      var d = distanciaMetros(latlng.lat, latlng.lng, pts[i].lat, pts[i].lon);
      if (d < mejorD) { mejorD = d; mejor = i; }
    }
    return mejor;
  }

  // El slider normalmente recorre TODA la ruta. Cuando hay un tramo
  // filtrado (por tiempo o por zona) recorre SOLO los puntos de ese tramo:
  // "indicesSlider" es la lista de posiciones REALES de la ruta que el
  // slider puede alcanzar (null = toda la ruta). Mover el slider NO le
  // pregunta nada al servidor: los puntos ya están descargados.
  var indicesSlider = null;
  var indiceActual = 0;           // posición real (en la ruta) del punto seleccionado ahora

  function configurarSlider(indices, indiceRealInicial) {
    indicesSlider = indices;
    var total = indices ? indices.length : rutaSel.puntos.length;
    var pos = 0;
    if (indiceRealInicial !== undefined) {
      pos = indices ? indices.indexOf(indiceRealInicial) : indiceRealInicial;
      if (pos < 0) { pos = 0; }
    }
    var slider = porId('slider-momento');
    slider.min = 0;
    slider.max = total - 1;
    slider.value = pos;
    porId('etq-slider').textContent = indices ? 'Momento del tramo' : 'Momento del recorrido';
    moverSlider(pos);
  }

  // Al quitar el filtro el slider vuelve a recorrer toda la ruta, y se
  // queda en el mismo punto en el que estaba.
  function restaurarSliderCompleto() {
    if (indicesSlider === null) { return; }
    if (!rutaSel || !rutaSel.puntos) { indicesSlider = null; return; }
    configurarSlider(null, indiceActual);
  }

  function rangoIndices(desde, hasta) {
    var r = [];
    for (var i = desde; i <= hasta; i++) { r.push(i); }
    return r;
  }

  // "pos" es la posición del slider (no necesariamente la del punto en la ruta).
  function moverSlider(pos) {
    pos = parseInt(pos, 10);
    if (!rutaSel || !rutaSel.puntos) { return; }
    var real = indicesSlider ? indicesSlider[pos] : pos;
    var punto = rutaSel.puntos[real];
    if (!punto) { return; }
    indiceActual = real;
    if (marcadorSlider) { marcadorSlider.setLatLng([punto.lat, punto.lon]); }
    porId('slider-etiqueta').textContent = fechaLarga(punto.hora_recepcion);
    mostrarInfoPunto(punto);
  }

  // Selecciona un punto por su posición REAL en la ruta (clic sobre la
  // línea, botón de una pasada). Con un tramo filtrado, los puntos que
  // quedan fuera del tramo se ignoran.
  function moverSliderAIndiceReal(real) {
    var pos = indicesSlider ? indicesSlider.indexOf(real) : real;
    if (pos < 0) { return; }
    porId('slider-momento').value = pos;
    moverSlider(pos);
  }

  function mostrarInfoPunto(punto) {
    porId('punto-info').hidden = false;
    porId('punto-lat').textContent = punto.lat;
    porId('punto-lon').textContent = punto.lon;
    porId('punto-fecha').textContent = fechaSola(punto.fecha);
    porId('punto-hora').textContent = punto.hora;
  }

  function volverALista() {
    vistaActual = 'lista';
    cancelarBusquedasZona();
    document.body.classList.remove('ruta-abierta');    // oculta el slider flotante
    porId('vista-detalle').hidden = true;
    porId('vista-lista').hidden = false;
    porId('menu-cuerpo').scrollTop = 0;
    desarmar();
    reiniciarSubfiltros();
    capaDetalle.clearLayers();
    lineaDetalle = marcadorInicio = marcadorFin = marcadorSlider = null;
    rutaSel = null;
    // Vuelven las capas que se ocultaron al abrir el detalle (ver seleccionarRecorrido).
    if (!mapaHistorico.hasLayer(capaRutas)) { mapaHistorico.addLayer(capaRutas); }
    if (!mapaHistorico.hasLayer(capaTramosResultado)) { mapaHistorico.addLayer(capaTramosResultado); }
    if (!mapaHistorico.hasLayer(capaZona)) { mapaHistorico.addLayer(capaZona); }
    restaurarResaltado();
    ajustarAResultados();
  }

  // =====================================================================
  // 9. HISTÓRICOS — segundo filtrado: dentro de la ruta elegida
  // =====================================================================

  function prepararSubfiltros(puntos) {
    if (puntos.length === 0) { return; }
    var ini = puntos[0].hora_recepcion.slice(0, 16);
    var fin = puntos[puntos.length - 1].hora_recepcion.slice(0, 16);
    ['sub-inicio', 'sub-fin'].forEach(function (id) {
      var campo = porId(id);
      campo.min = ini;
      campo.max = fin;
      campo.value = '';
    });
  }

  function reiniciarSubfiltros() {
    subTipo = null;
    porId('sf-tiempo').classList.remove('activo');
    porId('sf-zona').classList.remove('activo');
    porId('sub-panel-tiempo').hidden = true;
    porId('sub-panel-zona').hidden = true;
    porId('aviso-sub').textContent = '';
    limpiarResultadosSub(true);
  }

  function elegirSubTipo(tipo) {
    var nuevo = (subTipo === tipo) ? null : tipo;
    limpiarResultadosSub(true);
    desarmar();
    subTipo = nuevo;
    porId('sf-tiempo').classList.toggle('activo', nuevo === 'tiempo');
    porId('sf-zona').classList.toggle('activo', nuevo === 'zona');
    porId('sub-panel-tiempo').hidden = nuevo !== 'tiempo';
    porId('sub-panel-zona').hidden = nuevo !== 'zona';
    if (nuevo === 'zona') { armarCentro('sub'); }
  }

  // Quita lo dibujado por el segundo filtrado. Con quitarCirculo=true
  // también borra el círculo (y en el filtro por zona vuelve a pedir el centro).
  function limpiarResultadosSub(quitarCirculo) {
    if (capaSub) { capaSub.clearLayers(); }
    atenuarRuta(false);
    restaurarSliderCompleto();
    porId('resultado-sub').hidden = true;
    porId('resultado-sub').innerHTML = '';
    porId('aviso-sub').textContent = '';
    if (quitarCirculo) {
      if (capaSubZona) { capaSubZona.clearLayers(); }
      zonaS.centro = null;
      zonaS.circulo = null;
      clearTimeout(temporizadorZona.sub);
      porId('ayuda-sub-zona').textContent = AYUDA_COLOCAR;
      if (subTipo === 'zona' && vistaActual === 'detalle') { armarCentro('sub'); }
    }
    reordenarDetalle();
  }

  // Atenúa (o restaura) la línea completa de la ruta, para que el tramo
  // resaltado se distinga claramente del resto.
  function atenuarRuta(atenuar) {
    if (lineaDetalle) { lineaDetalle.setStyle({ opacity: atenuar ? 0.3 : 0.95 }); }
  }

  // Resalta en el mapa los puntos desde..hasta de la ruta abierta (línea
  // más gruesa con halo + marcadores en los extremos, vía
  // dibujarTramoEnCapa) y atenúa el resto de la ruta. Devuelve los límites.
  function dibujarTramo(desdeIdx, hastaIdx) {
    var pts = rutaSel.puntos, coords = [];
    for (var i = desdeIdx; i <= hastaIdx; i++) { coords.push([pts[i].lat, pts[i].lon]); }
    var limites = dibujarTramoEnCapa(capaSub, coords, rutaSel.color);
    atenuarRuta(true);
    return limites;
  }

  function mostrarResultadoSub(html, botones) {
    var caja = porId('resultado-sub');
    caja.hidden = false;
    caja.innerHTML = html;
    (botones || []).forEach(function (b) { caja.appendChild(b); });
    if (caja.scrollIntoView) { caja.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }

  function avisoSub(texto) {
    var aviso = porId('aviso-sub');
    aviso.textContent = texto;
    if (texto && aviso.scrollIntoView) { aviso.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }

  // ---- Por tiempo ----
  function aplicarSubTiempo() {
    if (!rutaSel || !rutaSel.puntos) { return; }
    var ini = porId('sub-inicio').value, fin = porId('sub-fin').value;
    limpiarResultadosSub(false);
    if (!ini && !fin) { avisoSub('Elige al menos un instante de inicio o de fin.'); return; }
    if (ini && fin && ini > fin) { avisoSub('El fin debe ser posterior al inicio.'); return; }

    // Si el usuario elige un instante ANTES de que empiece la ruta o DESPUÉS
    // de que termine, se corrige solo al más cercano que sí esté dentro de
    // la ruta, se actualizan los campos y se le avisa.
    var pts = rutaSel.puntos;
    var rutaMin = pts[0].hora_recepcion.slice(0, 16);
    var rutaMax = pts[pts.length - 1].hora_recepcion.slice(0, 16);
    var ajustado = false;
    function acotar(v) { return v < rutaMin ? rutaMin : (v > rutaMax ? rutaMax : v); }
    if (ini && acotar(ini) !== ini) { ini = acotar(ini); porId('sub-inicio').value = ini; ajustado = true; }
    if (fin && acotar(fin) !== fin) { fin = acotar(fin); porId('sub-fin').value = fin; ajustado = true; }
    var nota = ajustado
      ? '<div class="nota-ajuste">No se encontró recorrido en el horario seleccionado. Se ajustó automáticamente al más cercano dentro de la ruta.</div>'
      : '';

    // Las horas de los puntos son texto ISO ("2026-09-27T20:43:12..."), que
    // se ordena igual que el tiempo: se pueden comparar como texto.
    var desde = ini || '';
    var hasta = fin ? fin + ':59.999999' : '\uffff';
    var primero = -1, ultimo = -1;
    rutaSel.puntos.forEach(function (p, i) {
      var t = p.hora_recepcion;
      if (t >= desde && t <= hasta) { if (primero < 0) { primero = i; } ultimo = i; }
    });

    if (primero < 0) { mostrarResultadoSub(nota + 'Ningún punto de esta ruta cae en ese rango de tiempo.'); return; }

    var limites = dibujarTramo(primero, ultimo);
    reordenarDetalle();
    mapaHistorico.fitBounds(limites, opcionesAjuste());
    configurarSlider(rangoIndices(primero, ultimo));     // el slider recorre solo este tramo
    mostrarResultadoSub(
      nota +
      '<b>Tramo seleccionado</b><br>' +
      'Inicio: ' + fechaLarga(pts[primero].hora_recepcion) + '<br>' +
      'Fin: ' + fechaLarga(pts[ultimo].hora_recepcion) + '<br>' +
      (ultimo - primero + 1 === 1 ? '1 punto' : (ultimo - primero + 1) + ' puntos')
    );
  }

  // ---- Por zona ----
  // Se ejecuta sola al colocar, mover o cambiar el radio del círculo.
  // opciones (opcionales): ajustar:false = no mover la vista; avisar = aviso flotante.
  function aplicarSubZona(opciones) {
    opciones = opciones || {};
    if (!rutaSel || !rutaSel.puntos) { return; }
    limpiarResultadosSub(false);
    if (!zonaS.centro) { avisoSub(AYUDA_COLOCAR); return; }

    var pts = rutaSel.puntos;
    var pasadas = calcularPasadas(pts, zonaS.centro.lat, zonaS.centro.lng, zonaS.radio);
    if (pasadas.length === 0) {
      mostrarResultadoSub('Esta ruta no pasa por la zona seleccionada.');
      if (opciones.avisar) { mostrarAvisoMapa('Esta ruta no pasa por la zona'); }
      return;
    }

    var limites = [];
    var botones = pasadas.map(function (ps, k) {
      limites.push(dibujarTramo(ps.desde, ps.hasta));
      var b = document.createElement('button');
      b.className = 'pasada';
      b.innerHTML = (pasadas.length > 1 ? '<b>Pasada ' + (k + 1) + '</b><br>' : '') +
        'Entrada: ' + fechaLarga(pts[ps.desde].hora_recepcion) + '<br>' +
        'Salida: ' + fechaLarga(pts[ps.hasta].hora_recepcion);
      b.addEventListener('click', function () {
        moverSliderAIndiceReal(ps.desde);
        mapaHistorico.fitBounds(limites[k], opcionesAjuste());
      });
      return b;
    });
    reordenarDetalle();
    // El slider recorre solo los puntos que están dentro de la zona (todas las pasadas).
    var enZona = [];
    pasadas.forEach(function (ps) { enZona = enZona.concat(rangoIndices(ps.desde, ps.hasta)); });
    configurarSlider(enZona);
    if (opciones.ajustar !== false) {
      mapaHistorico.fitBounds(unirBounds(limites.concat([zonaS.circulo.getBounds()])), opcionesAjuste());
    }
    if (opciones.avisar) { mostrarAvisoMapa(pasadas.length === 1 ? '1 pasada por la zona' : pasadas.length + ' pasadas por la zona'); }
    mostrarResultadoSub('<b>' + (pasadas.length === 1 ? 'Tramo dentro de la zona' : pasadas.length + ' pasadas por la zona') + '</b>', botones);
  }
</script>
</body>
